// This profile is aimed at public Arma 3 servers running large mission packs
// and 50+ mods. The goal is a conservative, high-stability baseline for Linux
// hosts with good uplink capacity. Adjust bandwidth values to your host.
//
// Recommended host baseline for this file:
// - 4+ dedicated CPU threads with strong single-core performance
// - 100 Mbit/s or faster real uplink
// - Headless clients for AI-heavy missions
// - verifySignatures enabled in server.cfg

// BANDWIDTH SETTINGS

// Guaranteed bandwidth available to the server (in bps).
// Set high enough so the scheduler does not behave as if the host is starved.
// 100 Mbit/s ~= 104857600 bps.
MinBandwidth = 52428800;

// Maximum bandwidth the server may use (in bps).
// Keep below the physical link if multiple game instances share the host.
MaxBandwidth = 104857600;

// PACKET SETTINGS

// Maximum number of packets processed per simulation frame.
// Higher values help busy, modded servers, but can add overhead if the host is
// already CPU-limited.
MaxMsgSend = 512;

// Maximum payload size of guaranteed packets (bytes).
// Good default for heavily modded servers with frequent scripted events.
MaxSizeGuaranteed = 1024;

// Maximum payload size of non-guaranteed packets (bytes).
// Keeps state traffic efficient without pushing packet sizes too high.
MaxSizeNonguaranteed = 256;

// Maximum packet size sent over the network.
// 1400 is a safe MTU-friendly value for most providers.
class sockets
{
    maxPacketSize = 1400;
};

// SMOOTHNESS SETTINGS

// Minimum positional error before far units are updated.
// Lower than default to help vehicles and infantry feel smoother at distance on
// large co-op / modded PvE scenarios.
MinErrorToSend = 0.0025;

// Minimum positional error before nearby units are updated.
// Slightly reduced for close-quarters combat while avoiding overly chatty sync.
MinErrorToSendNear = 0.015;

// FILE NOTES
// - If your server shares bandwidth with other services, lower MaxBandwidth.
// - If your server is CPU-bound, reduce MaxMsgSend before increasing it.
// - For very small private groups, you can often reduce MinBandwidth safely.
